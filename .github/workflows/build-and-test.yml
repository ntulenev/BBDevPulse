name: Build and test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore BBDevPulse.slnx

      - name: Build
        run: dotnet build BBDevPulse.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test BBDevPulse.slnx --configuration Release --no-build --no-restore
